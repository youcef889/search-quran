<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}القرآن الكريم{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/search.js') }}" defer></script>
</head>

<body>

<nav class="navbar" aria-label="التنقل الرئيسي">
    <div class="navbar-inner">

        <a class="brand" href="{{ url_for('main.index') }}">
            <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path d="M12 2a7 7 0 0 0-7 7v6a7 7 0 0 0 7 7 7 7 0 0 0 7-7V9a7 7 0 0 0-7-7zm0 2a5 5 0 0 1 5 5h-2a3 3 0 0 0-3 3 3 3 0 0 0-3-3H7a5 5 0 0 1 5-5zm0 10a3 3 0 0 1 3 3h-2a1 1 0 0 0-2 0H9a3 3 0 0 1 3-3z"
                      fill="currentColor"/>
            </svg>
            <span>القرآن الكريم</span>
        </a>

        <div class="navbar-links">
            <a href="{{ url_for('main.index') }}"
               class="{% if request.endpoint == 'main.index' %}active{% endif %}">
                الرئيسية
            </a>
            <a href="{{ url_for('search.search_page') }}"
               class="{% if request.endpoint == 'search.search_page' %}active{% endif %}">
                البحث بالكلمات
            </a>
            <a href="{{ url_for('search.search_passage_page') }}"
               class="{% if request.endpoint == 'search.search_passage_page' %}active{% endif %}">
                البحث بالآية
            </a>
        </div>

    </div>
</nav>

<header class="hero">

    <div class="hero-ornament" aria-hidden="true"></div>

    <h1 class="hero-title">
        {% block hero_title %}القرآن الكريم{% endblock %}
    </h1>

    {% block hero_subtitle %}
    <p class="hero-subtitle">
        وَإِنَّهُ لَكِتَابٌ عَزِيزٌ
    </p>
    {% endblock %}

</header>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

<footer class="footer">
    <p>القرآن الكريم — بحث وتصفّح</p>
</footer>

</body>
</html>
